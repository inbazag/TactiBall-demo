<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TactiBall — Prototype</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="logo-wrap">
        <div class="logo-ball">⚽</div>
        <div>
          <h1>TactiBall</h1>
          <p>Think. Plan. Score.</p>
        </div>
      </div>
      <div class="level-info">Level: <span id="level-number">1</span></div>
    </header>

    <main>
      <section class="left">
        <div class="phone">
          <canvas id="pitch" width="540" height="360"></canvas>
          <div id="quickboost" class="quickboost">
            <div class="qb-title">Quick Boost</div>
            <div id="qb-question" class="qb-question">Question text</div>
            <div id="qb-choices" class="qb-choices"></div>
          </div>
        </div>
      </section>

      <aside class="right">
        <div class="panel">
          <h3>Command Blocks</h3>
          <div id="blocks" class="blocks">
            <div class="block" draggable="true" data-cmd="PASS">PASS</div>
            <div class="block" draggable="true" data-cmd="MOVE">MOVE</div>
            <div class="block" draggable="true" data-cmd="SHOOT">SHOOT</div>
            <div class="block" draggable="true" data-cmd="DRIBBLE">DRIBBLE</div>
          </div>

          <h4>Sequence</h4>
          <div id="sequence" class="sequence" ondragover="event.preventDefault()"></div>

          <div class="controls">
            <button id="undo">Undo</button>
            <button id="run" class="primary">Run Sequence</button>
          </div>

          <div id="message" class="message"></div>
          <div class="hint">Tip: Answer the Quick Boost correctly to gain Energy and enable SHOOT.</div>
        </div>
      </aside>
    </main>

    <footer>
      <div class="features">
        <strong>Features:</strong> Short tactical puzzles • 12–16 yrs • Non-violent • Short rounds
      </div>
    </footer>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-text"></div>
      <div class="modal-actions">
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
