<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TactiBall — v2 (Possession Fix)</title>
<style>
:root{
  --bg:#fbf8f3; --card:#ffffff; --green:#daf3d9; --accent:#2b8f66;
  --yellow:#fff1b8; --blue:#1e90ff; --red:#ff5c5c; --navy:#0f1724;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);-webkit-text-size-adjust:100%;}
.container{display:flex;flex-direction:column;height:100vh;align-items:stretch;justify-content:center;padding:6px}
.app{max-width:1400px;margin:auto;background:var(--card);border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(5,10,20,0.06);display:flex;flex-direction:column;height:calc(100vh - 20px)}
.header{display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:50%;background:orange;display:flex;align-items:center;justify-content:center;color:white;font-weight:800}
.brand h1{margin:0;font-size:18px}
.brand p{margin:0;color:#475569;font-size:12px}
.level-info{font-weight:700;color:#334155;font-size:14px}
.main{display:flex;flex:1;gap:10px;padding:8px;align-items:stretch}
.left{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
.pitch-card{background:var(--green);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center}
canvas{width:900px;max-width:100%;height:360px;border-radius:8px;background:#e9f5ea}
.quick{width:92%;background:#fff;border-radius:8px;padding:8px;border:1px solid #e6e6e6;margin-top:6px}
.qb-title{font-weight:700;margin-bottom:6px}
.qb-choices{display:flex;gap:8px;flex-wrap:wrap}
.qb-choice{background:var(--yellow);padding:8px 10px;border-radius:8px;cursor:pointer;border:2px solid transparent;font-weight:700}
.right{width:340px;display:flex;flex-direction:column;gap:8px}
.panel{background:transparent;padding:6px}
.blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.block{background:var(--yellow);padding:12px;border-radius:10px;text-align:center;font-weight:800;cursor:pointer;user-select:none}
.sequence{min-height:64px;border-radius:10px;padding:8px;background:#fff;border:2px dashed #e5e7eb;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls{display:flex;gap:8px;margin-top:10px}
button{padding:10px 12px;border-radius:10px;border:none;cursor:pointer}
.primary{background:var(--accent);color:white;font-weight:800}
.secondary{background:#f1f5f9}
.message{margin-top:8px;min-height:24px;font-weight:700;color:#0f1724}
.footer{padding:8px;border-top:1px solid #f1f5f9;font-size:13px;color:#475569}
.tip{font-size:13px;color:#6b7280;margin-top:8px}
.restart-wrap{display:flex;gap:8px;align-items:center;justify-content:flex-end}

/* Responsive landscape friendly */
@media (max-width:900px){
  .main{flex-direction:column-reverse}
  .right{width:100%}
  canvas{height:260px}
}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.5)}
.modal-box{background:white;padding:14px;border-radius:10px;min-width:260px;text-align:center}
.modal.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="app" role="application">
    <div class="header">
      <div class="brand">
        <div class="logo">⚽</div>
        <div>
          <h1>TACTIBALL</h1>
          <p>Think. Plan. Score.</p>
        </div>
      </div>
      <div class="level-info">Level <span id="level-num">1</span></div>
    </div>

    <div class="main">
      <div class="left">
        <div class="pitch-card">
          <canvas id="pitch" width="540" height="360" aria-label="Tactic pitch"></canvas>
          <div class="quick" id="quickboost">
            <div class="qb-title">Quick Boost</div>
            <div id="qb-question" style="font-weight:600">Question text</div>
            <div id="qb-choices" class="qb-choices"></div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="panel">
          <h3 style="margin:0 0 8px 0">Command Blocks</h3>
          <div id="blocks" class="blocks">
            <div class="block" data-cmd="PASS">PASS</div>
            <div class="block" data-cmd="MOVE">MOVE</div>
            <div class="block" data-cmd="SHOOT">SHOOT</div>
            <div class="block" data-cmd="DRIBBLE">DRIBBLE</div>
          </div>

          <h4 style="margin:8px 0 6px 0">Sequence</h4>
          <div id="sequence" class="sequence" aria-live="polite"></div>

          <div class="controls" style="margin-top:8px">
            <button id="undo" class="secondary">Undo</button>
            <button id="run" class="primary">Run Sequence</button>
          </div>

          <div id="message" class="message"></div>

          <div class="restart-wrap" style="margin-top:10px">
            <button id="restart" class="secondary">Restart</button>
          </div>

          <div class="tip">Tip: Answer the Quick Boost correctly to gain Energy and enable SHOOT.</div>
        </div>
      </div>
    </div>

    <div class="footer">Features: Short tactical puzzles • Ages 12–16 • Non-violent • Short rounds</div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modal-text" style="font-weight:700;margin-bottom:10px"></div>
    <button id="modal-ok" style="padding:8px 12px;background:var(--accent);color:white;border-radius:8px;border:none">OK</button>
  </div>
</div>

<script>
/* TactiBall v2 - single file with correct possession logic and Restart button */
const canvas = document.getElementById('pitch');
const ctx = canvas.getContext('2d');
const seqArea = document.getElementById('sequence');
const blocks = document.querySelectorAll('#blocks .block');
const runBtn = document.getElementById('run');
const undoBtn = document.getElementById('undo');
const restartBtn = document.getElementById('restart');
const message = document.getElementById('message');
const levelNum = document.getElementById('level-num');
const modal = document.getElementById('modal');
const modalText = document.getElementById('modal-text');
const modalOk = document.getElementById('modal-ok');

let sequence = [];
let energy = 0;
let currentLevel = 0;

// level data (players positions, opponents, question and correct choice index)
const levels = [
  {
    players: [{x:80,y:180},{x:180,y:140},{x:260,y:220}],
    opp: [{x:420,y:120},{x:460,y:240}],
    question: "Which player should receive the pass for the fastest goal?",
    choices: ["Left — near wing","Center — open lane","Right — blocked"],
    correct: 1
  },
  {
    players: [{x:70,y:220},{x:170,y:100},{x:250,y:190}],
    opp: [{x:420,y:180},{x:460,y:120}],
    question: "Which play speeds the attack most?",
    choices: ["Dribble forward","Pass to center then shoot","Hold ball"],
    correct: 1
  }
];

function drawLevel(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // pitch
  ctx.fillStyle = "#9fd89e";
  ctx.fillRect(10,10,520,340);
  ctx.strokeStyle = "#3b7a3f"; ctx.lineWidth = 3; ctx.strokeRect(10,10,520,340);
  // centerline
  ctx.strokeStyle = "#bfeac4"; ctx.beginPath(); ctx.moveTo(270,10); ctx.lineTo(270,350); ctx.stroke();
  // goal
  ctx.fillStyle = "#fff"; ctx.fillRect(538,150,12,60);

  const lvl = levels[currentLevel];
  // players
  lvl.players.forEach((p,i)=>{
    ctx.beginPath(); ctx.fillStyle='#1e90ff'; ctx.arc(p.x,p.y,16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.fillText('P'+(i+1), p.x, p.y+4);
  });
  // opponents
  lvl.opp.forEach((o)=>{ ctx.beginPath(); ctx.fillStyle='#ff5c5c'; ctx.arc(o.x,o.y,16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.fillText('O', o.x, o.y+4);
  });
}
drawLevel();
updateMessage();

function updateMessage(){
  message.innerText = `Sequence: ${sequence.join(' → ') || '(empty)'}  •  Energy: ${energy}`;
}

// Tap to add commands to sequence
blocks.forEach(b=>{
  b.addEventListener('click', ()=>{
    const cmd = b.dataset.cmd;
    sequence.push(cmd);
    const el = document.createElement('div');
    el.className = 'block';
    el.innerText = cmd;
    el.dataset.cmd = cmd;
    // tap to remove that specific item in sequence
    el.addEventListener('click', ()=>{
      const children = Array.from(seqArea.children);
      const idx = children.indexOf(el);
      if(idx>-1){
        sequence.splice(idx,1);
        el.remove();
        updateMessage();
      }
    });
    seqArea.appendChild(el);
    updateMessage();
  });
});

undoBtn.addEventListener('click', ()=>{
  if(sequence.length>0){
    sequence.pop();
    seqArea.removeChild(seqArea.lastElementChild);
    updateMessage();
  }
});

restartBtn.addEventListener('click', ()=>{
  resetDemo();
  showModal('Game restarted.');
});

// QuickBoost setup
function setupQuickBoost(){
  const qbQ = document.getElementById('qb-question');
  const qbChoices = document.getElementById('qb-choices');
  const lvl = levels[currentLevel];
  qbQ.innerText = lvl.question;
  qbChoices.innerHTML = '';
  lvl.choices.forEach((c, i)=>{
    const d = document.createElement('div');
    d.className = 'qb-choice';
    d.innerText = c;
    d.addEventListener('click', ()=> handleChoice(i));
    qbChoices.appendChild(d);
  });
}
setupQuickBoost();

function handleChoice(idx){
  const lvl = levels[currentLevel];
  if(idx === lvl.correct){
    energy = 1;
    updateMessage();
    showModal('Correct — Energy granted!');
  } else {
    energy = Math.max(0, energy-1);
    updateMessage();
    showModal('Not correct — try again!');
  }
}

// Run sequence: check energy for SHOOT
runBtn.addEventListener('click', async ()=>{
  if(sequence.length === 0){ showModal('Add commands to your sequence first!'); return; }
  if(sequence.includes('SHOOT') && energy <= 0){ showModal('You need energy from Quick Boost to SHOOT.'); return; }
  await playSequenceAnimation();
});

// Updated playSequenceAnimation with possession logic
async function playSequenceAnimation(){
  const lvl = levels[currentLevel];
  // possession starts with player index 0
  let currentHolderIndex = 0;
  let ball = {x: lvl.players[currentHolderIndex].x, y: lvl.players[currentHolderIndex].y};

  const drawBall = (pos)=>{
    drawLevel();
    // highlight current holder with a subtle ring
    const holder = lvl.players[currentHolderIndex];
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(30,144,255,0.12)';
    ctx.lineWidth = 8;
    ctx.arc(holder.x, holder.y, 22, 0, Math.PI*2);
    ctx.stroke();

    // draw ball
    ctx.beginPath(); ctx.fillStyle='orange'; ctx.arc(pos.x,pos.y,8,0,Math.PI*2); ctx.fill();
  };

  drawBall(ball);

  for(let cmd of sequence){
    if(cmd === 'PASS'){
      // pass transfers to the next player in order
      const next = (currentHolderIndex + 1) % lvl.players.length;
      const target = lvl.players[next];
      await animate(ball, target, 420, drawBall);
      ball = {x: target.x, y: target.y};
      currentHolderIndex = next; // now next player holds the ball

    } else if(cmd === 'MOVE'){
      // Move is performed by current holder: move forward/right
      const target = {x: Math.min(ball.x + 70, 500), y: ball.y};
      await animate(ball, target, 360, drawBall);
      ball = target;
      // update holder's logical position if close enough (do not change holder index)
      // no change to currentHolderIndex

    } else if(cmd === 'DRIBBLE'){
      // Dribble by current holder: small forward with slight random y
      const target = {x: Math.min(ball.x + 40, 500), y: ball.y + (Math.random()*30-15)};
      await animate(ball, target, 300, drawBall);
      ball = target;

    } else if(cmd === 'SHOOT'){
      // Shoot from current holder towards goal
      const goal = {x: 548, y: 180};
      await animate(ball, goal, 600, drawBall);
      const success = Math.random() < 0.88;
      if(success){
        showModal('GOAL! Level complete!');
        await sleep(800);
        unlockNextLevel();
      } else {
        showModal('Missed — try another plan.');
      }
    }
    await sleep(220);
  }

  // reset sequence & energy after run
  sequence = []; seqArea.innerHTML = ''; energy = 0; updateMessage();
}

function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }

function animate(from, to, dur, drawFn){
  const start = performance.now();
  return new Promise(res=>{
    function frame(now){
      let t = (now - start)/dur; if(t>1) t=1;
      const x = from.x + (to.x - from.x)*t;
      const y = from.y + (to.y - from.y)*t;
      drawFn({x,y});
      if(t<1) requestAnimationFrame(frame);
      else res();
    }
    requestAnimationFrame(frame);
  });
}

function unlockNextLevel(){
  if(currentLevel < levels.length - 1){
    currentLevel++;
    levelNum.innerText = currentLevel + 1;
    resetForLevel();
    showModal('Level unlocked!');
  } else {
    showModal('Demo finished — great job!');
  }
}

function resetForLevel(){
  sequence = []; seqArea.innerHTML = ''; energy = 0;
  setupQuickBoost();
  drawLevel();
  updateMessage();
}

function resetDemo(){
  currentLevel = 0;
  levelNum.innerText = 1;
  currentHolderIndex = 0;
  resetForLevel();
}

// modal helper
function showModal(txt){ modalText.innerText = txt; modal.classList.remove('hidden'); }
modalOk.addEventListener('click', ()=> modal.classList.add('hidden'));

// init
resetForLevel();
updateMessage();
</script>
</body>
</html>
